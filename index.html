<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worth90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
      color-scheme: dark;
    --bg: #0F1613;
    --surface: #172019;
    --surface-hover: #1D2721;
    --line: #26332C;
    --text: #F5F3EE;
    --text-dim: #8B978C;
    --gold: #D4A24C;
    --gold-dim: #6B5730;
    --dull: #4A5550;
    --good: #7FB88A;
    --tarihegecer: #E4EBFB;
    --chip-active-bg: #F5F3EE;
    --chip-active-text: #0F1613;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F2F2;
    --surface: #E7E2D5;
    --surface-hover: #DEDACB;
    --line: #D5CFBC;
    --text: #1B211C;
    --text-dim: #9AA096;
    --gold: #12A628;
    --gold-dim: #D9C09A;
    --dull: #ccc;
    --good: #c79639;
    --tarihegecer: #091840;
    --chip-active-bg: #1B211C;
    --chip-active-text: #F1EEE5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .theme-toggle {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .theme-toggle:hover { border-color: var(--gold); }

  header h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  header p {
    color: var(--text-dim);
    margin: 0 0 28px;
    font-size: 15px;
    max-width: 46ch;
    line-height: 1.5;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }

  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .control-label {
    font-size: 12px;
    color: var(--text-dim);
    width: 100%;
    margin-bottom: -4px;
  }

  select, .chip {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
  }

  .chip {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .chip:hover { border-color: #3A4A41; color: var(--text); }

  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
    border-color: var(--chip-active-bg);
    font-weight: 600;
  }

  select.league-select {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    max-width: 100%;
  }

  select.league-select option {
    background: var(--surface);
    color: var(--text);
  }

  .sort-toggle {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
  }

  .sort-toggle button {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .sort-toggle button.active {
    background: var(--line);
    color: var(--text);
    font-weight: 600;
  }

  .list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 16px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    align-items: center;
    transition: background 0.15s;
    cursor: pointer;
  }

  .row:hover { background: var(--surface-hover); }

  .row-item {
    border-bottom: 1px solid var(--line);
  }

  .row-item .row {
    border-bottom: none;
  }

  .accordion-panel {
    padding: 0 4px 20px;
  }

  .accordion-inner {
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
  }

  .video-frame-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
  }

  .video-frame-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .no-highlight {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  .watch-external {
    padding: 28px 16px;
    text-align: center;
  }

  .watch-external p {
    margin: 0 0 14px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .watch-btn {
    display: inline-block;
    background: var(--chip-active-bg);
    color: var(--chip-active-text);
    padding: 10px 20px;
    border-radius: 100px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  .watch-btn:hover { opacity: 0.85; }

  .meta {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 8px;
  }

  .teams-row {
    grid-column: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .teams {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
  }

  .score-col {
    grid-row: 2 / span 1;
    grid-column: 2;
    text-align: center;
    width: 100px;
  }

  .score-box {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1;
    min-width: 56px;
  }

  .score-box.highlight {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  .score-wrap {
    position: relative;
    display: inline-block;
  }

  .stars-above {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
    z-index: 2;
    pointer-events: none;
  }

  .stars-above span {
    font-size: 30px;
    line-height: 1;
  }

  .badge {
    font-size: 13px;
    font-weight: 600;
    margin-top: -4px;
  }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-dim);
  }

  @media (max-width: 480px) {
    .teams { font-size: 14.5px; }
    .score-box { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <header>
      <h1>Worth90</h1>
      <p>Futbol maçları için istatistiklere dayalı, heyecan &amp; keyif puanı hesaplamaya çalışan deneysel bir çalışma.</p>
    </header>
    <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">☀️</button>
  </div>

  <div class="controls">
    <div class="control-row" id="dayFilter"></div>
    <div class="control-row">
      <span class="control-label">Lig</span>
      <select class="league-select" id="leagueFilter"></select>
    </div>
    <div class="control-row">
      <div class="sort-toggle">
        <button data-sort="date" class="active">Kronolojik</button>
        <button data-sort="score">Puana Göre</button>
      </div>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
// Worth90 - veri data/matches.json'dan fetch ile çekiliyor
let MATCHES = [];
let leagues = [];

function badgeFor(score) {
  if (score < 30) return { tr: "Uyutabilir", color: "var(--dull)", boxed: false, stars: 0 };
  if (score < 45) return { tr: "İdare Eder", color: "var(--text-dim)", boxed: false, stars: 0 };
  if (score < 61) return { tr: "İyi Maç", color: "var(--good)", boxed: false, stars: 0 };
  if (score < 76) return { tr: "Tatmin Edici", color: "var(--gold)", boxed: true, stars: 1 };
  if (score < 84) return { tr: "Futbol Ziyafeti", color: "#44A2FF", boxed: true, stars: 2 };
  return { tr: "Tarihe Geçer", color: "var(--tarihegecer)", boxed: true, stars: 3 };
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
}

function dayKey(iso) {
  return iso.slice(0, 10);
}

function extractYoutubeId(url) {
  try {
    const u = new URL(url);
    return u.searchParams.get("v");
  } catch (e) {
    return null;
  }
}

let currentDay = "all";
let currentLeague = "all";
let currentSort = "date";
let expandedId = null;

// Tarih Filtresi Kontrolü
function isMatchInSelectedDateRange(matchDateStr, filterId) {
  if (filterId === "all") return true;

  // Tekil gün seçimi (YYYY-MM-DD)
  if (filterId.match(/^\d{4}-\d{2}-\d{2}$/)) {
    return dayKey(matchDateStr) === filterId;
  }

  const matchDate = new Date(matchDateStr);
  const today = new Date();

  // Last week
  if (filterId === "last_week") {
    const start = new Date(today);
    start.setDate(today.getDate() - 14);
    const end = new Date(today);
    end.setDate(today.getDate() - 7);
    return matchDate >= start && matchDate <= end;
  }

  // Last 30 days
  if (filterId === "last_30_days") {
    const past30 = new Date(today);
    past30.setDate(today.getDate() - 30);
    return matchDate >= past30;
  }

  // This month
  if (filterId === "this_month") {
    return matchDate.getFullYear() === today.getFullYear() &&
           matchDate.getMonth() === today.getMonth();
  }

  return true;
}

function renderControls() {
  const dayFilter = document.getElementById("dayFilter");
  dayFilter.innerHTML = "";

  const today = new Date();
  const dayNames = ["Pa", "Pzt", "Sa", "Çarş", "Per", "Cum", "Cmt"];

  const filterOptions = [
    { id: "all", label: "Tümü" }
  ];

  // Son 7 Gün
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    
    const isoDate = d.toISOString().slice(0, 10);
    const dayNum = d.getDate();

    let label = "";
    if (i === 0) label = `${dayNum} bugün`;
    else if (i === 1) label = `${dayNum} dün`;
    else label = `${dayNum} ${dayNames[d.getDay()]}`;

    filterOptions.push({ id: isoDate, label: label });
  }

  // Özel Aralıklar
  filterOptions.push(
    { id: "last_week", label: "Last week" },
    { id: "last_30_days", label: "Last 30 days" },
    { id: "this_month", label: "This month" }
  );

  filterOptions.forEach(opt => {
    const chip = document.createElement("button");
    chip.className = "chip" + (currentDay === opt.id ? " active" : "");
    chip.textContent = opt.label;
    chip.onclick = () => { currentDay = opt.id; render(); };
    dayFilter.appendChild(chip);
  });

  const leagueSelect = document.getElementById("leagueFilter");
  leagueSelect.innerHTML = '<option value="all">Tüm Ligler</option>' +
    leagues.map(l => `<option value="${l}">${l}</option>`).join("");
  leagueSelect.value = currentLeague;
  leagueSelect.onchange = (e) => { currentLeague = e.target.value; render(); };

  document.querySelectorAll(".sort-toggle button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.sort === currentSort);
    btn.onclick = () => { currentSort = btn.dataset.sort; render(); };
  });
}

function toggleAccordion(matchId) {
  expandedId = (expandedId === matchId) ? null : matchId;
  render();
}

function renderAccordionPanel(m) {
  const hl = m.highlight;
  let inner;
  if (hl && hl.URL) {
    const videoId = extractYoutubeId(hl.URL);
    if (!videoId) {
      inner = `<div class="no-highlight">Özet linki bulundu ama video ID okunamadı.</div>`;
    } else {
      inner = `
        <div class="video-frame-wrap">
          <iframe src="https://www.youtube.com/embed/${videoId}"
                  title="${m.home} - ${m.away} ozet"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen></iframe>
        </div>
      `;
    }
  } else {
    inner = `<div class="no-highlight">Bu maç için özet henüz bulunamadı.</div>`;
  }
  return `
    <div class="accordion-panel">
      <div class="accordion-inner">${inner}</div>
    </div>
  `;
}

function render() {
  renderControls();

  let filtered = MATCHES.filter(m =>
    isMatchInSelectedDateRange(m.date, currentDay) &&
    (currentLeague === "all" || m.league === currentLeague)
  );

  filtered.sort((a, b) => currentSort === "score"
    ? b.score - a.score
    : new Date(b.date) - new Date(a.date)
  );

  const list = document.getElementById("list");
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Bu filtrelere uyan maç yok.</div>';
    return;
  }

  list.innerHTML = filtered.map(m => {
    const b = badgeFor(m.score);
    const scoreStyle = `color:${b.color};`;
    const badgeStyle = `color:${b.color};`;
    const starsHtml = b.stars > 0
      ? `<div class="stars-above"><span style="color:${b.color}">${"★".repeat(b.stars)}</span></div>`
      : "";
    const isExpanded = expandedId === m.match_id;
    const cleanScore = m.score_str.split(" ").join("");
    return `
      <div class="row-item">
        <div class="row" data-id="${m.match_id}">
          <div class="meta">${formatDate(m.date)} · ${m.league}</div>
          <div class="teams-row">
            <div class="teams">${m.home} ${cleanScore} ${m.away}</div>
          </div>
          <div class="score-col">
            <div class="score-wrap">
              ${starsHtml}
              <div class="score-box" style="${scoreStyle}">${Math.round(m.score)}</div>
            </div>
            <div class="badge" style="${badgeStyle}">${b.tr}</div>
          </div>
        </div>
        ${isExpanded ? renderAccordionPanel(m) : ""}
      </div>
    `;
  }).join("");

  list.querySelectorAll(".row").forEach(rowEl => {
    rowEl.addEventListener("click", () => toggleAccordion(rowEl.dataset.id));
  });
}

function setupThemeToggle() {
  const themeToggle = document.getElementById("themeToggle");
  themeToggle.onclick = () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.documentElement.removeAttribute("data-theme");
      themeToggle.textContent = "☀️";
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      themeToggle.textContent = "🌙";
    }
  };
}

async function init() {
  setupThemeToggle();
  const list = document.getElementById("list");
  list.innerHTML = '<div class="empty">Veri yükleniyor...</div>';

  try {
    const resp = await fetch("data/matches.json");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    MATCHES = Object.values(data);
    leagues = [...new Set(MATCHES.map(m => m.league))].sort();
    render();
  } catch (err) {
    list.innerHTML = `<div class="empty">Veri yüklenemedi: ${err.message}<br>data/matches.json dosyasının reponun kökündeki data/ klasöründe olduğundan emin ol.</div>`;
    console.error(err);
  }
}

init();
</script>
</body>
</html>
