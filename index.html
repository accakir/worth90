<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worth90</title>
<style>:root{--bg:#f2f2f2;--surface:#e7e2d5;--line:#d5cfbc;--text:#1b211c;--dim:#697168;--accent:#12a628}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:32px 20px}h1{margin:0;font-size:40px}.sub{color:var(--dim);margin:4px 0 28px}.row{width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:16px 4px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 16px;cursor:pointer;color:inherit}.row:hover{background:var(--surface)}.meta{grid-column:1/-1;color:var(--dim);font-size:12px}.teams{font-weight:650}.points{font-size:28px;font-weight:800;color:var(--accent)}.details{border-top:0;border-bottom:1px solid var(--line);padding:0 4px 16px}.details[hidden]{display:none}.loading,.notice{color:var(--dim);padding:8px 0}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#111}.source{font-size:13px;color:var(--dim);margin:8px 0 0}.empty{color:var(--dim);padding:40px 0}</style>
<main class="wrap"><h1>Worth90</h1><p class="sub">İstatistiklere dayalı heyecan puanı. Bir maça tıklayarak özetini aç.</p><section id="list" aria-live="polite"><p class="loading">Maçlar yükleniyor…</p></section></main>
<script>
const list=document.querySelector('#list');let openId=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(s){return new Date(s+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'});}
async function openHighlight(id){if(openId===id){document.querySelector(`#detail-${CSS.escape(id)}`).hidden=true;openId=null;return;}if(openId){const old=document.querySelector(`#detail-${CSS.escape(openId)}`);if(old){old.hidden=true;old.replaceChildren();}}openId=id;const box=document.querySelector(`#detail-${CSS.escape(id)}`);box.hidden=false;box.innerHTML='<p class="loading">Özet aranıyor…</p>';try{const r=await fetch(`/api/matches/${encodeURIComponent(id)}/highlight`);const data=await r.json();if(!r.ok)throw Error(data.message);if(openId!==id)return;box.innerHTML=`<iframe class="video" title="${esc(data.title)}" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(data.video_id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p class="source">${esc(data.channel)} · ${esc(data.title)}</p>`;}catch(e){if(openId===id)box.innerHTML=`<p class="notice">${esc(e.message)}</p>`;}}
async function render(){try{const r=await fetch('/api/matches');const matches=await r.json();if(!matches.length){list.innerHTML='<p class="empty">Henüz toplanmış maç yok. Önce <code>py app.py collect</code> çalıştırın.</p>';return;}list.innerHTML=matches.map(m=>`<article><button class="row" data-id="${esc(m.id)}" aria-expanded="false"><span class="meta">${date(m.date)} · ${esc(m.league)}</span><span class="teams">${esc(m.home)} ${esc(m.score)} ${esc(m.away)}</span><strong class="points">${Number(m.points).toFixed(0)}</strong></button><div class="details" id="detail-${esc(m.id)}" hidden></div></article>`).join('');list.querySelectorAll('.row').forEach(b=>b.addEventListener('click',()=>openHighlight(b.dataset.id)));}catch{list.innerHTML='<p class="empty">Maç listesi yüklenemedi.</p>';}}render();
</script></html>
