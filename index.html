<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worth90</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--bg:#f2f2f2;--surface:#e7e2d5;--hover:#dedacb;--line:#d5cfbc;--text:#1b211c;--dim:#9aa096;--dull:#ccc;--good:#c79639;--gold:#12a628;--feast:#44a2ff;--historic:#091840;--active:#1b211c;--active-text:#f1eee5}:root[data-theme=dark]{color-scheme:dark;--bg:#0f1613;--surface:#172019;--hover:#1d2721;--line:#26332c;--text:#f5f3ee;--dim:#8b978c;--dull:#4a5550;--good:#7fb88a;--gold:#d4a24c;--feast:#44a2ff;--historic:#e4ebfb;--active:#f5f3ee;--active-text:#0f1613}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Source Sans 3',sans-serif}.wrap{max-width:760px;margin:auto;padding:32px 20px 80px}.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}h1{font-family:Archivo,sans-serif;font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:-.02em;margin:0 0 4px}.sub{margin:0 0 28px;color:var(--dim);font-size:15px;max-width:46ch;line-height:1.5}.theme{flex-shrink:0;width:40px;height:40px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px}.controls{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}.control-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.control-label{font-size:12px;color:var(--dim);width:100%;margin-bottom:-4px}.chip,.league-select,.sort button{font-family:inherit;font-size:14px}.chip{background:var(--surface);border:1px solid var(--line);color:var(--dim);padding:7px 14px;border-radius:100px;cursor:pointer;white-space:nowrap}.chip.active{background:var(--active);color:var(--active-text);border-color:var(--active);font-weight:600}.league-select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;max-width:100%}.sort{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}.sort button{border:0;background:transparent;color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer}.sort button.active{background:var(--line);color:var(--text);font-weight:600}.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}.match{border-bottom:1px solid var(--line)}.row{width:100%;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 4px;align-items:center}.row:hover{background:var(--hover)}.meta{grid-column:1/-1;color:var(--dim);font-size:12px}.teams{font-size:16px;font-weight:600;line-height:1.3}.score-col{grid-row:2;grid-column:2;text-align:center;width:112px}.score-wrap{position:relative;display:inline-block}.points{font-family:Archivo,sans-serif;font-weight:900;font-size:30px;line-height:1}.stars{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;white-space:nowrap;filter:drop-shadow(0 1px 1px #0004)}.badge{font-size:12px;font-weight:600;margin-top:-4px;white-space:nowrap}.details{padding:0 4px 16px}.details[hidden]{display:none}.loading,.notice,.empty{color:var(--dim);padding:20px;text-align:center}.video{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#111}.source{font-size:13px;color:var(--dim);margin:8px 0 0}@media(max-width:480px){.teams{font-size:14.5px}.points{font-size:24px}}
</style></head><body><main class="wrap"><div class="header-row"><header><h1>Worth90</h1><p class="sub">Futbol maçları için istatistiklere dayalı, heyecan &amp; keyif puanı hesaplamaya çalışan deneysel bir çalışma.</p></header><button class="theme" id="theme" aria-label="Tema değiştir">☀️</button></div><section class="controls"><div class="control-row" id="days"></div><div class="control-row"><span class="control-label">Lig</span><select class="league-select" id="league"></select></div><div class="control-row"><div class="sort"><button data-sort="date" class="active">Kronolojik</button><button data-sort="score">Puana Göre</button></div></div></section><section class="list" id="list" aria-live="polite"><p class="loading">Maçlar yükleniyor…</p></section></main><script>
const list=document.querySelector('#list'),daysNode=document.querySelector('#days'),leagueNode=document.querySelector('#league');let matches=[],day='all',league='all',sort='date',openId=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'});const normalized=p=>Math.min(100,Number(p)/130*100);function category(p){if(p<30)return{label:'Uyutabilir',color:'var(--dull)',stars:0};if(p<45)return{label:'İdare Eder',color:'var(--dim)',stars:0};if(p<61)return{label:'İyi Maç',color:'var(--good)',stars:0};if(p<76)return{label:'Tatmin Edici',color:'var(--gold)',stars:1};if(p<84)return{label:'Futbol Ziyafeti',color:'var(--feast)',stars:2};return{label:'Tarihe Geçer',color:'var(--historic)',stars:3}}
function controls(){const dates=[...new Set(matches.map(m=>m.date))].sort();daysNode.innerHTML='';const add=(key,label)=>{const b=document.createElement('button');b.className='chip'+(day===key?' active':'');b.textContent=label;b.onclick=()=>{day=key;render()};daysNode.appendChild(b)};add('all','Tümü');dates.forEach(d=>add(d,date(d)));const leagues=[...new Set(matches.map(m=>m.league))].sort();leagueNode.innerHTML='<option value="all">Tüm Ligler</option>'+leagues.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');leagueNode.value=league;leagueNode.onchange=e=>{league=e.target.value;render()};document.querySelectorAll('[data-sort]').forEach(b=>{b.classList.toggle('active',b.dataset.sort===sort);b.onclick=()=>{sort=b.dataset.sort;render()}})}
async function openHighlight(id){if(openId===id){document.querySelector(`#detail-${CSS.escape(id)}`).hidden=true;openId=null;return}if(openId){const old=document.querySelector(`#detail-${CSS.escape(openId)}`);if(old){old.hidden=true;old.replaceChildren()}}openId=id;const box=document.querySelector(`#detail-${CSS.escape(id)}`);box.hidden=false;box.innerHTML='<p class="loading">Özet aranıyor…</p>';try{const r=await fetch(`/api/matches/${encodeURIComponent(id)}/highlight`),data=await r.json();if(!r.ok)throw Error(data.message);if(openId!==id)return;box.innerHTML=`<iframe class="video" title="${esc(data.title)}" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(data.video_id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p class="source">${esc(data.channel)} · ${esc(data.title)}</p>`}catch(e){if(openId===id)box.innerHTML=`<p class="notice">${esc(e.message)}</p>`}}
function render(){controls();let visible=matches.filter(m=>(day==='all'||m.date===day)&&(league==='all'||m.league===league));visible.sort((a,b)=>sort==='score'?Number(b.points)-Number(a.points):new Date(a.date)-new Date(b.date));if(!visible.length){list.innerHTML='<p class="empty">Bu filtrelere uyan maç yok.</p>';return}list.innerHTML=visible.map(m=>{const p=normalized(m.points),c=category(p);return `<article class="match"><button class="row" data-id="${esc(m.id)}"><span class="meta">${date(m.date)} · ${esc(m.league)}</span><span class="teams">${esc(m.home)} ${esc(m.score)} ${esc(m.away)}</span><span class="score-col"><span class="score-wrap">${c.stars?`<span class="stars" style="color:${c.color}">${'★'.repeat(c.stars)}</span>`:''}<strong class="points" style="color:${c.color}">${p.toFixed(0)}</strong></span><span class="badge" style="color:${c.color}">${c.label}</span></span></button><div class="details" id="detail-${esc(m.id)}" hidden></div></article>`}).join('');list.querySelectorAll('.row').forEach(b=>b.onclick=()=>openHighlight(b.dataset.id))}
document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.toggleAttribute('data-theme');document.querySelector('#theme').textContent=dark?'🌙':'☀️'};fetch('/api/matches').then(r=>r.json()).then(data=>{matches=data;render()}).catch(()=>list.innerHTML='<p class="empty">Maç listesi yüklenemedi.</p>');
</script></body></html>
