name: Worth90 Scan

on:
  # schedule:
    # Her 3 saatte bir çalışır (UTC). İhtiyaca göre sıklığı ayarlayabilirsin.
    # - cron: "0 */3 * * *"
  workflow_dispatch: {}  # Actions sekmesinden manuel tetiklemeye izin verir

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scan.py

      - name: Commit updated data
        run: |
          git config user.name "worth90-bot"
          git config user.email "actions@github.com"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "chore: update matches.json [skip ci]"
          git push
