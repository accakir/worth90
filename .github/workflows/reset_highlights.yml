
name: Python Dosyasini Calistir

on:
  workflow_dispatch: # Arayüzden manuel tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Kodu Çalıştır
        run: python reset_highlights.py  # Çalıştırılacak .py dosyasının adı
