name: Reset Highlights

on:
  workflow_dispatch: {}  # Sadece Actions sekmesinden manuel butonla tetiklenir

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reset highlights script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python reset_highlights.py

      - name: Commit updated data
        run: |
          git config user.name "worth90-bot"
          git config user.email "actions@github.com"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "chore: reset highlights in matches.json [skip ci]"
          git push
